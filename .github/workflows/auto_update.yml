name: Auto Update JSON
on:
  issues:
    types: [opened]

jobs:
  update-data:
    if: contains(github.event.issue.title, '新资源:')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - name: Update JSON
        shell: python
        run: |
          import json, os, re
          # 获取 issue 内容
          body = """${{ github.event.issue.body }}"""
          
          # 正则提取表单值 (匹配 Issue 表单的 Markdown 格式)
          def get_val(key):
              # 匹配 "标签: 值" 的格式
              pattern = rf"{key}.*?\n\n(.*?)(?=\n\n|$)"
              match = re.search(pattern, body, re.DOTALL)
              return match.group(1).strip() if match else ""

          # 提取数据
          link_raw = get_val("资源链接")
          if ',' in link_raw:
              name, url = link_raw.split(',', 1)
          else:
              name, url = "资源下载", link_raw

          new_entry = {
              "model": get_val("机型名称"),
              "chip": get_val("芯片型号"),
              "desc": get_val("描述信息"),
              "links": [{"name": name.strip(), "url": url.strip()}]
          }
          
          # 读取并追加到 data.json
          with open('data.json', 'r+', encoding='utf-8') as f:
              data = json.load(f)
              data.append(new_entry)
              f.seek(0)
              json.dump(data, f, ensure_ascii=False, indent=4)
              f.truncate()
          
      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Add new ROM via Issue"
          git push
