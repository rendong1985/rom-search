name: Auto Update JSON
on:
  issues:
    types: [opened]

jobs:
  update-data:
    if: contains(github.event.issue.title, '新资源:')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Run Update Script
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python3 -c "
          import json, re, os
          body = os.environ.get('ISSUE_BODY', '')
          def get_section(title):
              pattern = rf'### {title}\n\n(.*?)(?=\n\n###|$)'
              match = re.search(pattern, body, re.DOTALL)
              return match.group(1).strip() if match else ''

          new_entries = []
          # 1. 处理单条
          s_model = get_section('机型名称')
          if s_model and s_model != '_No response_':
              link_raw = get_section('资源链接')
              name, url = link_raw.split(',', 1) if ',' in link_raw else ('资源下载', link_raw)
              new_entries.append({
                  'model': s_model,
                  'chip': get_section('芯片型号'),
                  'desc': get_section('描述信息'),
                  'links': [{'name': name.strip(), 'url': url.strip()}]
              })

          # 2. 处理批量
          batch_text = get_section('批量添加列表')
          if batch_text and batch_text != '_No response_':
              for line in batch_text.split('\n'):
                  if '|' in line:
                      parts = [p.strip() for p in line.split('|')]
                      if len(parts) >= 4:
                          b_name, b_url = parts[3].split(',', 1) if ',' in parts[3] else ('资源下载', parts[3])
                          new_entries.append({
                              'model': parts[0], 'chip': parts[1], 'desc': parts[2],
                              'links': [{'name': b_name.strip(), 'url': b_url.strip()}]
                          })

          if not new_entries: exit(0)

          data = []
          if os.path.exists('data.json'):
              with open('data.json', 'r', encoding='utf-8') as f:
                  try: data = json.load(f)
                  except: data = []
          
          data.extend(new_entries)
          with open('data.json', 'w', encoding='utf-8') as f:
              json.dump(data, f, ensure_ascii=False, indent=4)
          "

      - name: Commit & Push
        run: |
          # 1. 配置 Git 身份
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # 2. 关键：先把修改过的 data.json 放入暂存区
          git add data.json
          
          # 3. 提交修改（即使远程有更新，先在本地生成一个 commit）
          # 使用 || true 是为了防止在没有内容更新时脚本报错停止
          git commit -m "自动更新资源: ${{ github.event.issue.title }}" || echo "No changes to commit"
          
          # 4. 拉取远程最新的更改并变基
          # 此时本地已经 commit 过了，所以工作区是干净的，pull --rebase 不再报错
          git pull origin main --rebase
          
          # 5. 推送回仓库
          git push origin main
