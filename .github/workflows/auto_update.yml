name: Auto Update JSON
on:
  issues:
    types: [opened]

jobs:
  update-data:
    if: contains(github.event.issue.title, '新资源:')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Run Update Script
        shell: bash
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python3 -c "
          import json, re, os
          body = os.environ.get('ISSUE_BODY', '')
          
          def get_section(title):
              # 增强匹配：兼容不同换行符和空行
              pattern = rf'### {title}\s*\n+(.*?)(?=\n+\s*###|$)'
              match = re.search(pattern, body, re.DOTALL)
              return match.group(1).strip() if match else ''

          new_entries = []

          # 1. 尝试处理单条
          s_model = get_section('机型名称')
          if s_model and s_model.lower() != '_no response_':
              link_raw = get_section('资源链接')
              name, url = link_raw.split(',', 1) if ',' in link_raw else ('资源下载', link_raw)
              new_entries.append({
                  'model': s_model,
                  'chip': get_section('芯片型号'),
                  'desc': get_section('描述信息'),
                  'links': [{'name': name.strip(), 'url': url.strip()}]
              })

          # 2. 尝试处理批量 (兼容各种换行符并过滤空行)
          batch_text = get_section('批量添加列表')
          if batch_text and batch_text.lower() != '_no response_':
              lines = [line.strip() for line in batch_text.replace('\r', '').split('\n') if line.strip()]
              for line in lines:
                  if '|' in line:
                      parts = [p.strip() for p in line.split('|')]
                      if len(parts) >= 4:
                          b_name, b_url = parts[3].split(',', 1) if ',' in parts[3] else ('资源下载', parts[3])
                          new_entries.append({
                              'model': parts[0],
                              'chip': parts[1],
                              'desc': parts[2],
                              'links': [{'name': b_name.strip(), 'url': b_url.strip()}]
                          })

          if not new_entries:
              print('Error: 未解析到有效数据')
              exit(0)

          # 3. 读取并合并
          data = []
          if os.path.exists('data.json'):
              with open('data.json', 'r', encoding='utf-8') as f:
                  try: data = json.load(f)
                  except: data = []
          
          data.extend(new_entries)
          with open('data.json', 'w', encoding='utf-8') as f:
              json.dump(data, f, ensure_ascii=False, indent=4)
          "

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "自动更新: $(date +'%Y-%m-%d %H:%M:%S')" || echo "无内容变更"
          git pull origin main --rebase
          git push origin main
