name: Auto Update JSON
on:
  issues:
    types: [opened]

jobs:
  update-data:
    if: contains(github.event.issue.title, '新资源:')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3

      - name: Run Python Script
        shell: bash
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python3 -c "
          import json, re, os
          body = os.environ.get('ISSUE_BODY', '')
          
          def get_section(title):
              match = re.search(rf'### {title}\n\n(.*?)(?=\n\n###|$)', body, re.DOTALL)
              return match.group(1).strip() if match else ''
              
          model = get_section('机型名称')
          chip = get_section('芯片型号')
          desc = get_section('描述信息')
          link_raw = get_section('资源链接')
          
          if ',' in link_raw:
              name, url = link_raw.split(',', 1)
          else:
              name, url = '资源下载', link_raw
              
          new_entry = {
              'model': model,
              'chip': chip,
              'desc': desc,
              'links': [{'name': name.strip(), 'url': url.strip()}]
          }
          
          data = []
          if os.path.exists('data.json'):
              with open('data.json', 'r', encoding='utf-8') as f:
                  try:
                      data = json.load(f)
                  except:
                      pass
                      
          data.append(new_entry)
          
          with open('data.json', 'w', encoding='utf-8') as f:
              json.dump(data, f, ensure_ascii=False, indent=4)
          "

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Add new ROM via Issue" || echo "No changes to commit"
          git push
