name: Auto Update JSON
on:
  issues:
    types: [opened]

jobs:
  update-data:
    if: contains(github.event.issue.title, '新资源:')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - name: Update JSON
        shell: python
        run: |
          import json, os, re
          # 获取 issue 内容
          body = """${{ github.event.issue.body }}"""
          
          # 正则提取表单值 (匹配 Issue 表单的 Markdown 格式)
          def get_val(key):
              # 匹配 "标签: 值" 的格式
              pattern = rf"{key}.*?\n\n(.*?)(?=\n\n|$)"
              match = re.search(pattern, body, re.DOTALL)
              return match.group(1).strip() if match else ""

          # 提取数据
          link_raw = get_val("资源链接")
          if ',' in link_raw:
              name, url = link_raw.split(',', 1)
          else:
              name, url = "资源下载", link_raw

          new_entry = {
              "model": get_val("机型名称"),
              "chip": get_val("芯片型号"),
              "desc": get_val("描述信息"),
              "links": [{"name": name.strip(), "url": url.strip()}]
          }
          
          # 读取并追加到 data.json
          with open('data.json', 'r+', encoding='utf-8') as f:
              data = json.load(f)
              data.append(new_entry)
              f.seek(0)
              json.dump(data, f, ensure_ascii=False, indent=4)
              f.truncate()
          
      - name: Commit & Push
        run: |
          import json, re

          # 获取 issue 内容
          body = """${{ github.event.issue.body }}"""
          
          # 定义一个解析函数，利用 Markdown 标题结构来抓取
          def get_section(title):
              # 匹配 ### 标题 下方的所有内容
              pattern = rf"### {title}\n\n(.*?)(?=\n\n###|$)"
              match = re.search(pattern, body, re.DOTALL)
              return match.group(1).strip() if match else ""

          # 提取字段 (注意：这里要对应你 add_rom.yml 里的 label 名字)
          model = get_section("机型名称")
          chip = get_section("芯片型号")
          desc = get_section("描述信息")
          link_raw = get_section("资源链接")

          # 处理链接逻辑
          if ',' in link_raw:
              name, url = link_raw.split(',', 1)
          else:
              name, url = "资源下载", link_raw

          new_entry = {
              "model": model,
              "chip": chip,
              "desc": desc,
              "links": [{"name": name.strip(), "url": url.strip()}]
          }
          
          # 写入文件
          with open('data.json', 'r+', encoding='utf-8') as f:
              data = json.load(f)
              data.append(new_entry)
              f.seek(0)
              json.dump(data, f, ensure_ascii=False, indent=4)
              f.truncate()
