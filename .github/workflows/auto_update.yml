name: Auto Update JSON
on:
  issues:
    types: [opened]

jobs:
  update-data:
    if: contains(github.event.issue.title, '新资源:')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - name: Update JSON
        shell: bash
        run: |
          python3 -c '
          import json, re, os
          body = """${{ github.event.issue.body }}"""
          
          def get_section(title):
              pattern = rf"### {title}\n\n(.*?)(?=\n\n###|$)"
              match = re.search(pattern, body, re.DOTALL)
              return match.group(1).strip() if match else ""

          model = get_section("机型名称")
          chip = get_section("芯片型号")
          desc = get_section("描述信息")
          link_raw = get_section("资源链接")

          if "," in link_raw:
              name, url = link_raw.split(",", 1)
          else:
              name, url = "资源下载", link_raw

          new_entry = {
              "model": model,
              "chip": chip,
              "desc": desc,
              "links": [{"name": name.strip(), "url": url.strip()}]
          }
          
          with open("data.json", "r+", encoding="utf-8") as f:
              data = json.load(f)
              data.append(new_entry)
              f.seek(0)
              json.dump(data, f, ensure_ascii=False, indent=4)
              f.truncate()
          '
          
      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Add new ROM via Issue"
          git push
