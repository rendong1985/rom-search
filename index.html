<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>刷机包搜索中心</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .result-card:hover { transform: translateY(-3px); transition: 0.3s; }
        .loading-spinner { border: 3px solid #f3f3f3; border-top: 3px solid #3498db; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        /* 平滑滚动 */
        html { scroll-behavior: smooth; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen p-4 md:p-8">

    <div class="max-w-2xl mx-auto">
        <header class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-800 mb-2">📦 机顶盒刷机包中心</h1>
            <p class="text-gray-500">自动提取数据，实时筛选你的专属救砖包</p>
        </header>

        <!-- 筛选与搜索框 -->
        <div class="flex flex-col gap-3 mb-6">
            <!-- 品牌筛选 -->
            <select id="brandFilter" onchange="doSearch()" class="w-full px-4 py-2 border border-gray-200 rounded-xl outline-none text-gray-700 bg-white shadow-sm focus:ring-2 focus:ring-blue-500 transition-all">
                <option value="">📂 所有品牌 (全部)</option>
            </select>
            
            <!-- 关键词搜索 -->
            <div class="flex gap-2 bg-white p-2 rounded-xl shadow-sm border border-gray-200 focus-within:ring-2 focus-within:ring-blue-500 transition-all">
                <input type="text" id="keyword" oninput="doSearch()" class="flex-1 px-4 py-2 outline-none text-gray-700" placeholder="输入型号关键词 (例如: CM201)...">
                <button onclick="doSearch()" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg font-medium transition shadow-md active:scale-95">搜索</button>
            </div>
        </div>

        <!-- 结果展示区 -->
        <div id="results" class="mt-6"></div>
    </div>

    <script>
        let romDatabase = [];

        /**
         * 1. 加载数据 
         * 通过在 URL 后添加 ?t=时间戳，强制浏览器跳过缓存获取最新 data.json
         */
        function loadData() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<div class="flex justify-center mt-10"><div class="loading-spinner"></div></div>';

            fetch('data.json?t=' + new Date().getTime())
                .then(res => {
                    if (!res.ok) throw new Error('网络响应异常');
                    return res.json();
                })
                .then(data => {
                    romDatabase = data;
                    initBrandFilter();
                    doSearch();
                })
                .catch(err => {
                    console.error('加载失败:', err);
                    resultsDiv.innerHTML = `
                        <div class="text-center p-8 bg-red-50 rounded-2xl border border-red-100">
                            <p class="text-red-500 font-medium">数据加载失败</p>
                            <p class="text-red-400 text-sm mt-2">请确认仓库中是否存在 data.json 或检查格式</p>
                            <button onclick="location.reload()" class="mt-4 px-4 py-2 bg-red-100 text-red-600 rounded-lg text-sm hover:bg-red-200 transition">重试</button>
                        </div>`;
                });
        }

        /**
         * 2. 初始化品牌筛选下拉框
         */
        function initBrandFilter() {
            const brandSelect = document.getElementById('brandFilter');
            // 提取每个 model 的第一个词作为品牌
            const brands = [...new Set(romDatabase.map(item => item.model.trim().split(/\s+|[-|]/)[0]))]
                            .filter(b => b && b.length > 0);
            
            brands.sort().forEach(brand => {
                const option = document.createElement("option");
                option.value = brand;
                option.textContent = brand;
                brandSelect.appendChild(option);
            });
        }

        /**
         * 3. 核心搜索与筛选逻辑
         */
        function doSearch() {
            const keyword = document.getElementById('keyword').value.toLowerCase().trim();
            const brand = document.getElementById('brandFilter').value;
            const resultsDiv = document.getElementById('results');
            
            // 筛选匹配项
            const found = romDatabase.filter(item => {
                const matchBrand = brand === "" || item.model.includes(brand);
                const matchKeyword = item.model.toLowerCase().includes(keyword) || 
                                   item.chip.toLowerCase().includes(keyword) || 
                                   item.desc.toLowerCase().includes(keyword);
                return matchBrand && matchKeyword;
            });

            // 如果没有结果
            if (found.length === 0) {
                resultsDiv.innerHTML = `
                    <div class="text-center py-20">
                        <p class="text-gray-400 text-lg">没有找到相关资源</p>
                        <p class="text-gray-300 text-sm mt-2">试试更换关键词或品牌</p>
                    </div>`;
                return;
            }

            // 渲染列表
            resultsDiv.innerHTML = found.map(rom => {
                const linksHtml = rom.links.map(l => `
                    <a href="${l.url}" target="_blank" 
                       class="px-4 py-2 rounded-lg text-sm font-medium bg-blue-50 text-blue-700 hover:bg-blue-600 hover:text-white border border-blue-100 transition-all flex items-center gap-1">
                        <span>${l.name || '立即下载'}</span>
                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="商10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                    </a>
                `).join('');

                return `
                    <div class="result-card bg-white p-6 rounded-2xl shadow-sm border border-gray-100 mb-4 transition-all duration-300">
                        <div class="flex justify-between items-start mb-3">
                            <h3 class="text-xl font-bold text-gray-800 leading-tight">${rom.model}</h3>
                            <span class="shrink-0 ml-3 text-[10px] font-mono font-bold uppercase bg-blue-100 text-blue-600 px-2 py-1 rounded-md tracking-tighter">
                                ${rom.chip}
                            </span>
                        </div>
                        <p class="text-gray-500 text-sm mb-5 leading-relaxed">${rom.desc}</p>
                        <div class="flex gap-3 flex-wrap border-t border-gray-50 pt-4">
                            ${linksHtml}
                        </div>
                    </div>
                `;
            }).join('');
        }

        // 启动加载
        loadData();
    </script>
</body>
</html>
