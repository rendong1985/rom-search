<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>刷机包搜索中心</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .result-card:hover { transform: translateY(-3px); transition: 0.3s; }
        .loading-spinner { border: 3px solid #f3f3f3; border-top: 3px solid #3498db; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gray-50 min-h-screen p-4 md:p-8">

    <div class="max-w-2xl mx-auto">
        <header class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-800 mb-2">📦 机顶盒刷机包中心</h1>
            <p class="text-gray-500">自动提取数据，实时筛选你的专属救砖包</p>
        </header>

        <!-- 筛选与搜索框 -->
        <div class="flex flex-col gap-3 mb-6">
            <select id="brandFilter" onchange="doSearch()" class="w-full px-4 py-2 border border-gray-200 rounded-xl outline-none text-gray-700 bg-white shadow-sm">
                <option value="">📂 所有品牌 (全部)</option>
            </select>
            <div class="flex gap-2 bg-white p-2 rounded-xl shadow-sm border border-gray-200">
                <input type="text" id="keyword" oninput="doSearch()" class="flex-1 px-4 py-2 outline-none text-gray-700" placeholder="输入型号关键词 (例如: CM201)...">
                <button onclick="doSearch()" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg font-medium transition">搜索</button>
            </div>
        </div>

        <div id="results" class="mt-6"></div>
    </div>

    <script>
        let romDatabase = [];

        // 1. 加载数据 (已添加时间戳强制刷新)
        // 使用 new Date().getTime() 确保每次获取的都是服务器上的最新 JSON
        fetch('data.json?t=' + new Date().getTime())
            .then(res => res.json())
            .then(data => {
                romDatabase = data;
                initBrandFilter();
                doSearch();
            })
            .catch(() => document.getElementById('results').innerHTML = '<p class="text-center text-red-500">数据加载失败，请检查 data.json 是否存在</p>');

        // 2. 自动生成品牌列表
        function initBrandFilter() {
            const brandSelect = document.getElementById('brandFilter');
            const brands = [...new Set(romDatabase.map(item => item.model.split(" ")[0]))];
            
            brands.forEach(brand => {
                const option = document.createElement("option");
                option.value = brand;
                option.textContent = brand;
                brandSelect.appendChild(option);
            });
        }

        // 3. 搜索逻辑
        function doSearch() {
            const keyword = document.getElementById('keyword').value.toLowerCase();
            const brand = document.getElementById('brandFilter').value;
            const resultsDiv = document.getElementById('results');
            
            // 筛选数据
            const found = romDatabase.filter(item => {
                const matchBrand = brand === "" || item.model.startsWith(brand);
                const matchKeyword = item.model.toLowerCase().includes(keyword) || 
                                   item.chip.toLowerCase().includes(keyword) || 
                                   item.desc.toLowerCase().includes(keyword);
                return matchBrand && matchKeyword;
            });

            // 渲染视图
            if (found.length === 0) {
                resultsDiv.innerHTML = '<p class="text-center text-gray-400 mt-10">抱歉，没找到符合条件的资源</p>';
                return;
            }

            resultsDiv.innerHTML = found.map(rom => {
                const links = rom.links.map(l => 
                    `<a href="${l.url}" target="_blank" class="px-4 py-1.5 rounded-full text-sm font-medium bg-blue-50 text-blue-700 hover:bg-blue-100 border border-blue-200">${l.name}</a>`
                ).join('');

                return `
                    <div class="result-card bg-white p-5 rounded-2xl shadow-sm border border-gray-100 mb-4 transition-all">
                        <h3 class="text-lg font-bold text-gray-800">
                            ${rom.model} 
                            <span class="ml-2 text-[10px] uppercase bg-gray-100 text-gray-500 px-2 py-1 rounded-md tracking-wider">${rom.chip}</span>
                        </h3>
                        <p class="text-gray-500 text-sm mt-2 mb-4 leading-relaxed">${rom.desc}</p>
                        <div class="flex gap-2 flex-wrap">${links}</div>
                    </div>
                `;
            }).join('');
        }
    </script>
</body>
</html>
