<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>刷机包搜索中心</title>
    <!-- 引入 Tailwind CSS 极速美化 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .result-card:hover { transform: translateY(-3px); transition: 0.3s; }
        .loading-spinner { border: 3px solid #f3f3f3; border-top: 3px solid #3498db; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gray-50 min-h-screen p-4 md:p-8">

    <div class="max-w-2xl mx-auto">
        <header class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-800 mb-2">📦 机顶盒刷机包中心</h1>
            <p class="text-gray-500">输入型号，搜索你的专属救砖包</p>
        </header>

        <!-- 搜索框 -->
        <div class="flex gap-2 bg-white p-2 rounded-xl shadow-sm border border-gray-200">
            <input type="text" id="keyword" class="flex-1 px-4 py-2 outline-none text-gray-700" placeholder="例如：CM101S-2">
            <button onclick="doSearch()" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg font-medium transition">搜索</button>
        </div>

        <div id="results" class="mt-6"></div>
    </div>

    <script>
        let romDatabase = [];

        // 加载数据
        fetch('data.json?t=' + new Date().getTime())
            .then(res => res.json())
            .then(data => romDatabase = data)
            .catch(() => document.getElementById('results').innerHTML = '<p class="text-center text-red-500">数据加载失败，请检查文件位置</p>');

        function doSearch() {
            const keyword = document.getElementById('keyword').value.toLowerCase();
            const resultsDiv = document.getElementById('results');
            
            if (!keyword) return alert('请输入机型！');
            resultsDiv.innerHTML = '<div class="flex justify-center mt-10"><div class="loading-spinner"></div></div>';

            setTimeout(() => { // 加个小延迟让动画更自然
                const found = romDatabase.filter(item => item.model.toLowerCase().includes(keyword));
                resultsDiv.innerHTML = '';

                if (found.length === 0) {
                    resultsDiv.innerHTML = '<p class="text-center text-gray-400 mt-10">抱歉，没找到该型号的资源</p>';
                    return;
                }

                found.forEach(rom => {
                    let links = rom.links.map(l => 
                        `<a href="${l.url}" target="_blank" class="px-4 py-1.5 rounded-full text-sm font-medium bg-blue-50 text-blue-700 hover:bg-blue-100 border border-blue-200">${l.name}</a>`
                    ).join('');

                    resultsDiv.innerHTML += `
                        <div class="result-card bg-white p-5 rounded-2xl shadow-sm border border-gray-100 mb-4">
                            <h3 class="text-lg font-bold text-gray-800">${rom.model} <span class="text-xs bg-gray-100 text-gray-600 px-2 py-0.5 rounded">${rom.chip}</span></h3>
                            <p class="text-gray-600 text-sm mt-2 mb-4">${rom.desc}</p>
                            <div class="flex gap-2 flex-wrap">${links}</div>
                        </div>
                    `;
                });
            }, 300);
        }
    </script>
</body>
</html>
