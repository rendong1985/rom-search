<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>刷机包搜索中心</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .result-card:hover { transform: translateY(-3px); transition: 0.3s; }
        .loading-spinner { border: 3px solid #f3f3f3; border-top: 3px solid #3498db; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        /* 平滑滚动 */
        html { scroll-behavior: smooth; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen p-4 md:p-8">

    <div class="max-w-2xl mx-auto">
        <header class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-800 mb-2">📦 机顶盒刷机包中心</h1>
            <p class="text-gray-500">自动提取数据，实时筛选你的专属救砖包</p>
        </header>

        <div class="bg-gradient-to-r from-blue-50 to-indigo-50 border border-blue-100 rounded-2xl p-4 mb-6 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 shadow-sm">
            <div class="flex items-center gap-3">
                <span class="flex h-9 w-9 items-center justify-center rounded-xl bg-blue-100 text-blue-600 shrink-0 text-lg">
                    💬
                </span>
                <div>
                    <h4 class="text-sm font-bold text-blue-900">商务合作 & 资源投稿</h4>
                    <p class="text-xs text-blue-700 mt-0.5">链接失效？有更好用的固件分享？欢迎添加站长微信反馈。</p>
                </div>
            </div>
            <button onclick="toggleWeChatModal(true)" class="w-full sm:w-auto text-center shrink-0 bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold px-4 py-2.5 rounded-xl shadow-sm transition active:scale-95">
                添加站长微信
            </button>
        </div>

        <div class="flex flex-col gap-3 mb-6">
            <select id="brandFilter" onchange="resetSearch()" class="w-full px-4 py-2 border border-gray-200 rounded-xl outline-none text-gray-700 bg-white shadow-sm focus:ring-2 focus:ring-blue-500 transition-all">
                <option value="">📂 所有品牌 (全部)</option>
            </select>
            
            <div class="flex gap-2 bg-white p-2 rounded-xl shadow-sm border border-gray-200 focus-within:ring-2 focus-within:ring-blue-500 transition-all">
                <input type="text" id="keyword" oninput="resetSearch()" class="flex-1 px-4 py-2 outline-none text-gray-700 bg-transparent" placeholder="输入型号关键词 (例如: CM201)...">
                <button onclick="resetSearch()" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg font-medium transition shadow-md active:scale-95">搜索</button>
            </div>
        </div>

        <div id="results" class="mt-6"></div>

        <div id="pagination" class="flex items-center justify-center gap-1 mt-8 mb-12"></div>
    </div>

    <div id="wechatModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm" onclick="toggleWeChatModal(false)">
        <div class="bg-white rounded-3xl p-6 max-w-sm w-full text-center shadow-xl" onclick="event.stopPropagation()">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-gray-900">👥 关联站长微信</h3>
                <button onclick="toggleWeChatModal(false)" class="text-gray-400 hover:text-gray-600 text-xl font-medium">×</button>
            </div>
            <div class="bg-gray-100 rounded-2xl p-4 mb-4 flex items-center justify-center aspect-square max-w-[200px] mx-auto border border-gray-100">
                <img src="wechat-qrcode.png" alt="微信二维码" class="w-full h-full object-contain rounded-xl" onerror="this.src='https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=96kj.eu.org_StationMaster'">
            </div>
            <p class="text-sm text-gray-600 font-medium">微信号: <span class="bg-gray-100 px-2 py-0.5 rounded text-blue-600 font-mono select-all">dongdong2027</span></p>
            <p class="text-xs text-gray-400 mt-2">长按识别二维码，或复制微信号添加好友<br>(请备注: 96kj刷机网)</p>
        </div>
    </div>

    <script>
        let romDatabase = []; // 原始总数据
        let filteredData = []; // 筛选过后的数据
        
        // 分页核心配置
        let currentPage = 1;   // 当前页码
        const itemsPerPage = 10; // 【每页显示条数，你可以改成 15 或 20】

        function toggleWeChatModal(show) {
            const modal = document.getElementById('wechatModal');
            modal.classList.toggle('hidden', !show);
        }

        /**
         * 1. 加载数据 
         */
        function loadData() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<div class="flex justify-center mt-10"><div class="loading-spinner"></div></div>';

            fetch('data.json?t=' + new Date().getTime())
                .then(res => {
                    if (!res.ok) throw new Error('网络响应异常');
                    return res.json();
                })
                .then(data => {
                    romDatabase = data;
                    initBrandFilter();
                    resetSearch(); // 初始执行搜索筛选
                })
                .catch(err => {
                    console.error('加载失败:', err);
                    resultsDiv.innerHTML = `
                        <div class="text-center p-8 bg-red-50 rounded-2xl border border-red-100">
                            <p class="text-red-500 font-medium">数据加载失败</p>
                            <p class="text-red-400 text-sm mt-2">请确认仓库中是否存在 data.json 或检查格式</p>
                            <button onclick="location.reload()" class="mt-4 px-4 py-2 bg-red-100 text-red-600 rounded-lg text-sm hover:bg-red-200 transition">重试</button>
                        </div>`;
                });
        }

        /**
         * 2. 初始化品牌筛选下拉框
         */
        function initBrandFilter() {
            const brandSelect = document.getElementById('brandFilter');
            const brands = [...new Set(romDatabase.map(item => item.model.trim().split(/\s+|[-|]/)[0]))]
                            .filter(b => b && b.length > 0);
            
            brands.sort().forEach(brand => {
                const option = document.createElement("option");
                option.value = brand;
                option.textContent = brand;
                brandSelect.appendChild(option);
            });
        }

        /**
         * 当输入框或筛选改变时，重置页码并重新筛选
         */
        function resetSearch() {
            currentPage = 1; // 只要搜索或换品牌，立刻回到第一页
            executeFilter();
            renderPage();
        }

        /**
         * 3. 核心筛选逻辑 (把筛选和渲染拆分开，方便分页)
         */
        function executeFilter() {
            const keyword = document.getElementById('keyword').value.toLowerCase().trim();
            const brand = document.getElementById('brandFilter').value;
            
            filteredData = romDatabase.filter(item => {
                const matchBrand = brand === "" || item.model.includes(brand);
                const matchKeyword = item.model.toLowerCase().includes(keyword) || 
                                   item.chip.toLowerCase().includes(keyword) || 
                                   item.desc.toLowerCase().includes(keyword);
                return matchBrand && matchKeyword;
            });
        }

        /**
         * 4. 渲染指定页码的数据和分页条
         */
        function renderPage() {
            const resultsDiv = document.getElementById('results');
            const paginationDiv = document.getElementById('pagination');
            
            if (filteredData.length === 0) {
                resultsDiv.innerHTML = `
                    <div class="text-center py-20">
                        <p class="text-gray-400 text-lg">没有找到相关资源</p>
                        <p class="text-gray-300 text-sm mt-2">试试更换关键词或品牌</p>
                    </div>`;
                paginationDiv.innerHTML = ""; // 隐藏分页条
                return;
            }

            // 计算分页切片位置
            const totalPages = Math.ceil(filteredData.length / itemsPerPage);
            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const pageData = filteredData.slice(startIndex, endIndex);

            // 渲染当前的 10 条卡片
            resultsDiv.innerHTML = pageData.map(rom => {
                const linksHtml = rom.links.map(l => `
                    <a href="${l.url}" target="_blank" 
                       class="px-4 py-2 rounded-lg text-sm font-medium bg-blue-50 text-blue-700 hover:bg-blue-600 hover:text-white border border-blue-100 transition-all flex items-center gap-1">
                        <span>${l.name || '立即下载'}</span>
                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                    </a>
                `).join('');

                return `
                    <div class="result-card bg-white p-6 rounded-2xl shadow-sm border border-gray-100 mb-4 transition-all duration-300">
                        <div class="flex justify-between items-start mb-3">
                            <h3 class="text-xl font-bold text-gray-800 leading-tight">${rom.model}</h3>
                            <span class="shrink-0 ml-3 text-[10px] font-mono font-bold uppercase bg-blue-100 text-blue-600 px-2 py-1 rounded-md tracking-tighter">
                                ${rom.chip}
                            </span>
                        </div>
                        <p class="text-gray-500 text-sm mb-5 leading-relaxed">${rom.desc}</p>
                        <div class="flex gap-3 flex-wrap border-t border-gray-50 pt-4">
                            ${linksHtml}
                        </div>
                    </div>
                `;
            }).join('');

            // 🛠️ 渲染分页按钮控制条
            let paginationHtml = "";
            
            // 上一页
            paginationHtml += `
                <button onclick="changePage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''} 
                        class="px-3 py-2 rounded-xl text-sm font-medium border border-gray-200 bg-white text-gray-600 hover:bg-gray-50 disabled:opacity-40 disabled:hover:bg-white transition">
                    ◀
                </button>
            `;

            // 页码数字
            for (let i = 1; i <= totalPages; i++) {
                const isCurrent = i === currentPage;
                paginationHtml += `
                    <button onclick="changePage(${i})" 
                            class="w-10 h-10 rounded-xl text-sm font-bold border transition ${isCurrent ? 'bg-blue-600 border-blue-600 text-white shadow-sm shadow-blue-200' : 'bg-white border-gray-200 text-gray-600 hover:bg-gray-50'}">
                        ${i}
                    </button>
                `;
            }

            // 下一页
            paginationHtml += `
                <button onclick="changePage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''} 
                        class="px-3 py-2 rounded-xl text-sm font-medium border border-gray-200 bg-white text-gray-600 hover:bg-gray-50 disabled:opacity-40 disabled:hover:bg-white transition">
                    ▶
                </button>
            `;

            paginationDiv.innerHTML = paginationHtml;
        }

        /**
         * 5. 切换页码函数
         */
        function changePage(page) {
            const totalPages = Math.ceil(filteredData.length / itemsPerPage);
            if (page < 1 || page > totalPages) return;
            
            currentPage = page;
            renderPage();
            
            // 完美体验：换页后让网页自动平滑滚动回顶部
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // 启动加载
        loadData();
    </script>
</body>
</html>
